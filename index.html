<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mortgage calculator</title>
<style>
:root{--bg:#f3f5f2;--surface:#fff;--ink:#17261f;--muted:#5f6f66;--line:#d9e0db;--accent:#1f5c46;--accent-ink:#fff;--bar-i:#c9a24b;--bar-p:#1f5c46;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a15;--surface:#17241d;--ink:#e6eee9;--muted:#93a69b;--line:#2a3b32;--accent:#6fcf9f;--accent-ink:#0c1a13;--bar-i:#d9b45a;--bar-p:#6fcf9f;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 18px 48px}
h1{font:600 2rem/1.15 Georgia,"Iowan Old Style",serif;margin:0 0 6px}
p.sub{margin:0 0 24px;color:var(--muted)}
.grid{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
label{display:block;font-weight:600;margin:0 0 14px;font-size:.95rem}
.field{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;margin-top:5px;background:var(--bg)}
.field:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.field span{padding:0 10px;color:var(--muted);font-weight:400}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:10px 10px 10px 0;outline:none}
.field input.nolead{padding-left:10px}
.err{color:#b3261e;font-size:.9rem;min-height:1.2em;margin:0}
@media(prefers-color-scheme:dark){.err{color:#ff8a80}}
.pay{font:600 2.6rem/1.1 Georgia,serif;margin:0;color:var(--accent)}
.paylbl{color:var(--muted);margin:0 0 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.stats div{border-top:2px solid var(--line);padding-top:8px}
.stats b{display:block;font-size:1.1rem}
.stats small{color:var(--muted)}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--muted);margin-top:6px}
.legend em{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;font-style:normal}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:28px 0 10px;flex-wrap:wrap}
h2{margin:0;font:600 1.3rem Georgia,serif}
.tabs button,.dl{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;cursor:pointer}
.tabs button:first-child{border-radius:6px 0 0 6px}.tabs button:last-child{border-radius:0 6px 6px 0;border-left:0}
.tabs button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dl{border-radius:6px;margin-left:8px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{overflow-x:auto;max-height:560px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{position:sticky;top:0;background:var(--surface);font-size:.85rem;color:var(--muted);box-shadow:0 1px 0 var(--line)}
tr.yr td{background:var(--bg);font-weight:600}
</style>
</head>
<body>
<main>
<h1>Mortgage calculator</h1>
<p class="sub">Enter your loan details to see the monthly payment and full amortization schedule.</p>
<div class="grid">
  <section class="panel" aria-label="Loan details">
    <label>Loan amount<div class="field"><span>$</span><input id="amt" type="number" inputmode="decimal" min="0" step="1000" value="728000"></div></label>
    <label>Term (years)<div class="field"><input id="term" class="nolead" type="number" inputmode="numeric" min="1" max="50" step="1" value="30"></div></label>
    <label>Interest rate (annual)<div class="field"><input id="rate" class="nolead" type="number" inputmode="decimal" min="0" max="30" step="0.001" value="6.125"><span>%</span></div></label>
    <label>Extra monthly payment<div class="field"><span>$</span><input id="extra" type="number" inputmode="decimal" min="0" step="50" value="0"></div></label>
    <label>Lump sum (one-time, month 1)<div class="field"><span>$</span><input id="lump" type="number" inputmode="decimal" min="0" step="1000" value="0"></div></label>
    <p class="err" id="err" role="alert"></p>
  </section>
  <section class="panel" aria-live="polite">
    <p class="paylbl">Monthly payment (principal and interest)</p>
    <p class="pay" id="pay">–</p>
    <div class="stats">
      <div><b id="tot">–</b><small>Total paid</small></div>
      <div><b id="int">–</b><small>Total interest</small></div>
      <div><b id="n">–</b><small>Payments</small></div>
    </div>
    <div class="stats">
      <div><b id="payoff">–</b><small>Paid off in</small></div>
      <div><b id="saved">–</b><small>Paid off early by</small></div>
      <div><b id="isaved">–</b><small>Interest saved</small></div>
    </div>
    <div class="bar" id="bar"></div>
    <div class="legend"><span><em style="background:var(--bar-p)"></em>Principal</span><span><em style="background:var(--bar-i)"></em>Interest</span></div>
  </section>
</div>
<div class="head">
  <h2>Amortization schedule</h2>
  <div><span class="tabs"><button id="vm" aria-pressed="true">Monthly</button><button id="vy" aria-pressed="false">Yearly</button></span></div>
</div>
<div class="wrap"><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div>
</main>
<script>
const $=id=>document.getElementById(id);
const usd=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const usd0=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
let rows=[],view='m';
function calc(){
  const P=parseFloat($('amt').value),Y=parseFloat($('term').value),R=parseFloat($('rate').value);
  const bad=!(P>0)?'Enter a loan amount above 0.':!(Y>0&&Y<=50)?'Enter a term between 1 and 50 years.':!(R>=0&&R<=30)?'Enter a rate between 0 and 30%.':'';
  $('err').textContent=bad;
  if(bad){rows=[];render();return}
  const n=Math.round(Y*12),r=R/100/12;
  const pmt=r===0?P/n:P*r/(1-Math.pow(1+r,-n));
  const X=Math.max(0,parseFloat($('extra').value)||0),L=Math.max(0,parseFloat($('lump').value)||0);
  let base=0,b0=P;
  for(let k=1;k<=n;k++){const i=b0*r;base+=i;b0-=(k===n?b0:pmt-i);}
  let bal=P;rows=[];let ti=0;
  for(let k=1;k<=n&&bal>0.005;k++){
    const i=bal*r;
    const p=k===n?bal:Math.min(bal,pmt-i+X+(k===1?L:0));
    bal=Math.max(0,bal-p);ti+=i;
    rows.push({k,i,p,pay:p+i,bal});
  }
  const fmt=m=>{const y=Math.floor(m/12),mo=m%12;return y?y+' yr'+(mo?' '+mo+' mo':''):mo+' mo'};
  $('payoff').textContent=fmt(rows.length);
  const sm=n-rows.length;
  $('saved').textContent=(X>0||L>0)&&sm>0?fmt(sm):'–';
  $('isaved').textContent=(X>0||L>0)?usd0.format(base-ti):'–';
  $('pay').textContent=usd.format(pmt);
  $('tot').textContent=usd0.format(P+ti);
  $('int').textContent=usd0.format(ti);
  $('n').textContent=rows.length;
  const pp=P/(P+ti)*100;
  $('bar').innerHTML='<i style="width:'+pp+'%;background:var(--bar-p)"></i><i style="width:'+(100-pp)+'%;background:var(--bar-i)"></i>';
  render();
}
function render(){
  const yearly=view==='y';
  $('th').innerHTML=['<th>'+(yearly?'Year':'Payment #')+'</th>','<th>Payment</th>','<th>Principal</th>','<th>Interest</th>','<th>Balance</th>'].join('');
  let out='';
  if(!yearly){
    rows.forEach(r=>{
      if(r.k%12===1&&r.k>1||r.k===1)out+='<tr class="yr"><td colspan="5">Year '+Math.ceil(r.k/12)+'</td></tr>';
      out+=row(r.k,r.pay,r.p,r.i,r.bal);
    });
  }else{
    for(let y=0;y*12<rows.length;y++){
      const s=rows.slice(y*12,y*12+12);
      const sum=f=>s.reduce((a,b)=>a+b[f],0);
      out+=row(y+1,sum('pay'),sum('p'),sum('i'),s[s.length-1].bal);
    }
  }
  $('tb').innerHTML=out||'<tr><td colspan="5">Enter valid loan details to see the schedule.</td></tr>';
}
const row=(a,b,c,d,e)=>'<tr><td>'+a+'</td><td>'+usd.format(b)+'</td><td>'+usd.format(c)+'</td><td>'+usd.format(d)+'</td><td>'+usd.format(e)+'</td></tr>';
['amt','term','rate','extra','lump'].forEach(id=>$(id).addEventListener('input',calc));
function setView(v){view=v;$('vm').setAttribute('aria-pressed',v==='m');$('vy').setAttribute('aria-pressed',v==='y');render()}
$('vm').onclick=()=>setView('m');$('vy').onclick=()=>setView('y');
calc();
</script>
</body>
</html>
